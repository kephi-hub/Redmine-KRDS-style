  text_menu_capture_privacy: "※ 캡처에는 화면에 보이는 정보가 그대로 담깁니다. 개인정보가 보이는 화면은 테스트 계정·테스트 데이터로 캡처하세요. 캡처 파일은 PMS 서버(첨부 폴더)에 저장되고 PMS 백업에 포함됩니다."
  text_menu_capture_schedule: "서버 cron(setup/cron.example 의 화면 캡처 줄)이 있어야 자동으로 돕니다."
  text_menu_capture_selectors: "CSS 선택자. 비워 두면 흔한 이름(userId·username·loginId·type=password·submit 버튼 등)으로 찾습니다. 로그인 확인 요소를 적으면 로그인 뒤 그 요소가 있어야 성공으로 봅니다 (로그아웃 주소를 적었으면 그쪽이 우선)."
  text_menu_capture_settings: "서버의 헤드리스 크롬이 이 사이트에 로그인한 뒤 메뉴 구조도의 화면 URL 을 차례로 열어 캡처합니다. PMS 서버에서 이 주소로 접속할 수 있어야 합니다."
