  text_db_hint_mariadb_function: "Read-only accounts cannot see routines on MariaDB. Add: GRANT SELECT ON mysql.proc TO 'user'@'host';"
  text_db_hint_mariadb_procedure: "Read-only accounts cannot see routines on MariaDB. Add: GRANT SELECT ON mysql.proc TO 'user'@'host';"
  text_db_hint_mariadb_event: "To see MariaDB events add: GRANT SELECT ON mysql.event TO 'user'@'host';"
  text_db_hint_mariadb_trigger: MariaDB shows triggers only with the TRIGGER privilege, which also allows creating and dropping triggers.
  text_db_hint_mysql_function: "Read-only accounts cannot see routines on MySQL 8. Add: GRANT SHOW_ROUTINE ON *.* TO 'user'@'host';"
  text_db_hint_mysql_procedure: "Read-only accounts cannot see routines on MySQL 8. Add: GRANT SHOW_ROUTINE ON *.* TO 'user'@'host';"
  text_db_hint_mysql_event: MySQL 8 shows events only with the EVENT privilege, which also allows changing events.
  text_db_hint_mysql_trigger: MySQL 8 shows triggers only with the TRIGGER privilege, which also allows creating and dropping triggers.
  text_db_hint_postgresql_event: pg_cron jobs are visible only to the account that created them.
