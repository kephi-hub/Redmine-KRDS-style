  text_db_compare: 두 DB 의 테이블과 컬럼(타입·NULL·기본값·설명·키) 차이를 보여 줍니다.
  text_db_check: 모든 컬럼명을 용어사전의 약어와 대조합니다. 같은 이름의 컬럼은 하나로 묶어 보여 줍니다.
