  text_db_def_none: 정의(SQL)를 볼 권한이 없습니다.
  text_db_hint_mariadb_function: "MariaDB 는 조회 전용 계정에 함수·프로시저가 보이지 않습니다. 읽기 전용 권한을 더하세요: GRANT SELECT ON mysql.proc TO '계정'@'호스트';"
  text_db_hint_mariadb_procedure: "MariaDB 는 조회 전용 계정에 함수·프로시저가 보이지 않습니다. 읽기 전용 권한을 더하세요: GRANT SELECT ON mysql.proc TO '계정'@'호스트';"
  text_db_hint_mariadb_event: "MariaDB 이벤트(DB 잡)를 보려면 읽기 전용 권한을 더하세요: GRANT SELECT ON mysql.event TO '계정'@'호스트';"
  text_db_hint_mariadb_trigger: MariaDB 는 TRIGGER 권한이 있어야 트리거가 보입니다. 이 권한은 트리거를 만들고 지울 수도 있어 조회 전용 계정에는 권장하지 않습니다.
  text_db_hint_mysql_function: "MySQL 8 은 조회 전용 계정에 함수·프로시저가 보이지 않습니다. 읽기 전용 권한을 더하세요: GRANT SHOW_ROUTINE ON *.* TO '계정'@'호스트';"
  text_db_hint_mysql_procedure: "MySQL 8 은 조회 전용 계정에 함수·프로시저가 보이지 않습니다. 읽기 전용 권한을 더하세요: GRANT SHOW_ROUTINE ON *.* TO '계정'@'호스트';"
  text_db_hint_mysql_event: MySQL 8 은 EVENT 권한이 있어야 이벤트(DB 잡)가 보입니다. 이벤트를 만들고 지울 수도 있는 권한이라 조회 전용 계정에는 권장하지 않습니다.
  text_db_hint_mysql_trigger: MySQL 8 은 TRIGGER 권한이 있어야 트리거가 보입니다. 이 권한은 트리거를 만들고 지울 수도 있어 조회 전용 계정에는 권장하지 않습니다.
