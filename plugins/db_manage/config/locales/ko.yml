  text_db_server_info: 프로젝트에서 쓸 DB 서버 접속정보입니다. 비밀번호는 암호화해 저장하며, 접속할 때는 읽기 전용으로 테이블·컬럼 정보만 읽습니다. SELECT 권한만 있는 조회 전용 계정을 권장합니다.
  text_db_adapter_info: MS SQL Server·Oracle 은 준비 중입니다.
  text_db_database_info: MariaDB·MySQL 은 조회할 데이터베이스(스키마) 이름, PostgreSQL 은 접속할 데이터베이스 이름
  text_db_user_info: 조회 전용 계정 권장 (information_schema 를 읽을 수 있어야 함)
  text_db_schema_info: 비워 두면 PostgreSQL 은 public, MariaDB·MySQL 은 서버의 DB 이름
  text_db_production_info: 운영 DB 는 탭에 '운영' 표시, 비교 화면에서 기본 비교 대상(B)
  text_db_project: 프로젝트 DB 의 테이블·컬럼 구조를 봅니다. 테이블 정의서(엑셀) 내려받기, 개발/운영 비교, 용어사전 점검을 할 수 있습니다.
  text_db_compare: 두 DB 의 테이블과 컬럼(타입·NULL·기본값·설명·키) 차이를 보여 줍니다.
  text_db_check: 모든 컬럼명을 용어사전의 약어와 대조합니다. 같은 이름의 컬럼은 하나로 묶어 보여 줍니다.
  text_db_check_csv: 미등록 컬럼을 용어사전 가져오기 양식(CSV)으로 받아 정리한 뒤 용어사전에 올릴 수 있습니다.
  notice_db_connected: "%{name} 연결 성공 — %{version}"
  error_db_server_in_use: 프로젝트에서 사용 중인 DB 서버는 삭제할 수 없습니다. 프로젝트 설정 > DB 에서 먼저 연결을 지우세요.
