  text_field_permissions: 역할을 고르고 "상태 × 항목" 표를 정한 뒤 저장하면, 아래에서 고른 일감 유형 모두에 같은 규칙이 적용됩니다. 칸을 누를 때마다 편집 → 읽기 전용 → 필수 순서로 바뀝니다.
  label_fp_corner: "항목 ↓ / 일감 상태 →"
