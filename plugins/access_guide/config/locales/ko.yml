  text_access_tip: 한 사람이 여러 역할을 받으면 권한이 모두 합쳐집니다. 관리자 계정은 역할과 관계없이 모든 프로젝트에서 모든 일을 할 수 있습니다.
  text_access_user_tip: 프로젝트가 비공개라 구성원으로 들어 있는 프로젝트만 보입니다. 프로젝트 이름을 누르면 구성원 설정으로 이동합니다.
  text_simple_workflows: 역할을 고르고 상태 전환표를 정한 뒤 저장하면, 아래에서 고른 일감 유형 모두에 같은 규칙이 적용됩니다. 체크된 칸은 "왼쪽 상태 → 위쪽 상태" 로 바꿀 수 있다는 뜻입니다.
