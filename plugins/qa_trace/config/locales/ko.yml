  text_qa_import_case_rules: "칸 이름: 케이스 ID · 종류(단위/통합/인수) · 화면 ID 또는 메뉴 · 요구사항 ID(여러 개는 쉼표) · 케이스명 · 사전조건 · 절차 · 기대결과 · 사용(Y/N). ID 가 같은 케이스는 값만 갱신, 비어 있으면 TC-001 처럼 자동 번호."
