  text_pm_accounts: "발급한 계정(VPN·서버·DB·저장소 등)을 적습니다. 비밀번호는 적지 말고 접속정보(Vault)에 보관하세요."
  text_pm_audit_code: "비워 두면 AU-001 처럼 자동으로 붙습니다."
  text_pm_audit_import: "감리 보고서의 지적사항 표를 엑셀(xlsx) 또는 CSV 로 올리세요. 머리줄 이름으로 칸을 찾고, ID 가 같으면 값을 갱신합니다."
  text_pm_audit_status: "조치 완료 · 확인 완료로 바꾸면 조치일 · 확인일이 비어 있을 때 오늘로 들어갑니다."
  text_pm_audits: "감리 회차별 지적사항의 조치 계획 · 결과 · 확인을 관리하고 시정조치 계획서 · 결과 보고서를 엑셀로 받습니다."
  text_pm_mm_rule: "계획 M/M = 투입 기간(월별 날짜 비율) × 투입률, 실적 M/M = 이 프로젝트 소요시간 ÷ 168시간 (Redmine 사용자 연결 시). 기간은 투입 인력 전체 기간입니다."
  text_pm_notes: "보고서 요약 시트에 함께 들어갈 주요 이슈 · 건의 사항 (저장되지 않음)"
  text_pm_rate: "1~100% (전담 100%)"
  text_pm_reports: "기간을 고르면 일감 실적 · 다음 기간 계획 · 이슈·위험 · 변경요청 · 산출물 · 테스트·결함 · SR·SLA · 투입 인력 · 감리를 모아 보여 주고 엑셀로 받습니다. 켜진 모듈만 들어갑니다."
  text_pm_round_first: "[새 감리 회차] 로 감리 회차(예: 요구정의 단계 감리)를 먼저 만들면 회차별로 지적사항을 모아 볼 수 있습니다."
  text_pm_scan_delete: "이 진단 회차와 항목을 모두 지울까요?"
  text_pm_scan_file: "진단 도구 결과를 엑셀(xlsx) 또는 CSV 로 올리면 항목을 가져옵니다 (머리줄 이름으로 칸을 찾음). 앞 회차에서 예외 처리한 같은 항목(유형·파일·라인)은 예외가 유지되고, 앞 회차 항목은 이번 결과에 없으면 재진단 통과로 표시됩니다."
  text_pm_scan_first: "[새 진단 회차] 에서 진단 도구 결과 파일을 올리세요."
  text_pm_sec_scans: "보안약점 진단 회차별 결과를 가져와 항목마다 조치 완료 · 예외(사유) 를 기록합니다. 파일 경로가 프로그램 소스 경로와 같으면 프로그램에 연결됩니다."
  text_pm_staff_name: "Redmine 사용자를 고르면 비워 둬도 사용자 이름이 들어갑니다."
  text_pm_staff_user: "고르면 그 사용자의 소요시간으로 실적 M/M 을 계산합니다."
  text_pm_staffs: "투입 인력의 역할 · 등급 · 투입 기간 · 투입률로 계획 M/M 을, 소요시간으로 실적 M/M 을 계산하고 보안서약서 · 계정 발급 · 회수 · 교체 이력을 관리합니다."
