# 일감 상태 — 보류는 개발자·디자이너가 쓰는 "잠시 멈춤" 이라 열린 상태
issue_statuses:
- name: 보류
  is_closed: false

# 업무흐름 기본값 (모든 일감 유형 공통). 상태 이름 또는 all
# 역할 × 일감 유형 조합에 업무흐름이 하나도 없을 때만 채움 — 관리 화면에서 바꾼 업무흐름은 덮어쓰지 않음
workflows:
  PM/PL:
    from: all
    to: all
  개발자:
    from: [신규, 진행, 해결, 의견, 보류]
    to: [진행, 해결, 의견, 보류]
  디자이너:
    from: [신규, 진행, 해결, 의견, 보류]
    to: [진행, 해결, 의견, 보류]
