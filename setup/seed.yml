# Redmine 기준 설정
# setup/apply_settings.rb 가 읽어서 DB 에 반영 — 여러 번 실행해도 결과 같음
# id 대신 이름으로 적음 (서버마다 id 가 다를 수 있음)
settings:
  activity_days_default: '10'
  app_title: 프로젝트 관리 시스템 PMS
  attachment_max_size: '1048576'   # KB = 1GB
  cache_formatted_text: '0'
  commit_logtime_enabled: '1'
  default_language: ko
  default_notification_option: only_assigned
  default_projects_public: '0'   # 새 프로젝트는 비공개 (구성원만 보임)
  default_users_time_zone: Seoul
  feeds_limit: '15'
  login_required: '1'
  per_page_options: '25,50,100'
  plugin_vault:
    encryption_key: ''
    encrypt_files: 'on'
    use_redmine_encryption: 'on'
  reactions_enabled: '1'
  search_results_per_page: '10'
  text_formatting: common_mark
  ui_theme: krds
  user_format: lastnamefirstname
  wiki_compression: ''
  wiki_tablesort_enabled: '0'
commit_update_keywords:
- keywords: fixes,resolves
  status: 해결
  done_ratio: '100'
- keywords: closes
  status: 완료
  done_ratio: '100'
commit_logtime_activity: 개발
# 새 프로젝트를 만든 사용자에게 줄 역할 (프로젝트 생성은 관리자만)
new_project_user_role: PM/PL
default_projects_trackers:
- 결함
- 기능
- 지원
- 오류
- 회의
- 데이터 이관
- 작업
- 테스트
trackers:
- name: 결함
  default_status: 신규
- name: 기능
  default_status: 신규
- name: 지원
  default_status: 신규
- name: 오류
  default_status: 신규
- name: 회의
  default_status: 신규
- name: 데이터 이관
  default_status: 신규
- name: 작업
  default_status: 신규
- name: 테스트
  default_status: 신규
- name: 시안 수정
  default_status: 신규
- name: 퍼블리싱
  default_status: 신규
time_entry_activities:
- 설계
- 개발
- 수정
document_categories:
- 사용자 문서
- 기술 문서
# 기본 데이터의 역할 중 운영에서 쓰지 않아 지운 것
remove_roles:
- 관리자
- 보고자
roles:
- name: Non member
  builtin: 1
  permissions:
  - view_issues
  - view_news
  - view_messages
- name: Anonymous
  builtin: 2
  permissions:
  - view_issues
  - view_news
  - view_messages
