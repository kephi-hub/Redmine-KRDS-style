services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: redmine
      POSTGRES_USER: redmine
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redmine -d redmine"]
      interval: 5s
      retries: 10

  redmine:
    build: .
    image: local/redmine-vault:6.1.6
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${REDMINE_PORT:-3000}:3000"
    environment:
      REDMINE_DB_POSTGRES: db
      REDMINE_DB_DATABASE: redmine
      REDMINE_DB_USERNAME: redmine
      REDMINE_DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDMINE_SECRET_KEY_BASE: ${REDMINE_SECRET_KEY_BASE}
      REDMINE_CIPHER_KEY: ${REDMINE_CIPHER_KEY:?REDMINE_CIPHER_KEY 를 .env 에 넣으세요}   # config/configuration.yml 이 읽음
      REDMINE_PLUGINS_MIGRATE: "1"
      REDMINE_HOST_NAME: ${REDMINE_HOST_NAME:-}        # 메일 링크 등에 쓰는 주소 (예: 서버IP:3000)
      REDMINE_SYS_API_KEY: ${REDMINE_SYS_API_KEY:-}    # 저장소 커밋 가져오기 API 키 (cron 과 같은 값)
    volumes:
      - files:/usr/src/redmine/files     # 첨부파일
      - keys:/usr/src/redmine/keys       # Vault 키 파일
      - ./backup/ctl:/usr/src/redmine/backup_ctl:z   # PMS 백업 상태(관리 > 백업 화면) — 백업 파일 자체는 마운트하지 않음
      - ./config/configuration.yml:/usr/src/redmine/config/configuration.yml:z   # z: SELinux 라벨 (ro 금지: 엔트리포인트가 config/ 를 chown 함)
      - ./themes:/usr/src/redmine/themes:z   # 사용자 테마 (krds)
      - ./plugins/vault_ko:/usr/src/redmine/plugins/vault_ko:z   # Vault 한국어화 (번역+화면 문구)
      - ./plugins/krds_ui:/usr/src/redmine/plugins/krds_ui:z   # KRDS 화면 마크업 (문서 상세)
      - ./plugins/vault_types:/usr/src/redmine/plugins/vault_types:z   # 접속정보 유형 관리 (DB 테이블은 시작 때 자동 생성)
      - ./plugins/access_guide:/usr/src/redmine/plugins/access_guide:z   # 권한 한눈에 보기·업무흐름 간편 설정
      - ./plugins/jenkins_deploy:/usr/src/redmine/plugins/jenkins_deploy:z   # Jenkins 배포 연동 (DB 테이블은 시작 때 자동 생성)
      - ./plugins/glossary:/usr/src/redmine/plugins/glossary:z   # 용어사전 (프로젝트·공통, DB 테이블은 시작 때 자동 생성)
      - ./plugins/db_manage:/usr/src/redmine/plugins/db_manage:z   # DB 관리 (DB 서버 접속정보·스키마 조회, DB 테이블은 시작 때 자동 생성)
      - ./plugins/menu_tree:/usr/src/redmine/plugins/menu_tree:z   # 메뉴 구조도·시스템 권한 (DB 테이블은 시작 때 자동 생성)
      - ./plugins/qa_trace:/usr/src/redmine/plugins/qa_trace:z   # 요구사항 추적·테스트 (DB 테이블은 시작 때 자동 생성)
      - ./plugins/site_tools:/usr/src/redmine/plugins/site_tools:z   # 관리 도구 (메일 서버 SMTP 설정, 저장소 커미터 자동 연결)
      - ./plugins/ops_asset:/usr/src/redmine/plugins/ops_asset:z   # 운영 관리 (자산·스케줄러·점검·장애·인터페이스, DB 테이블은 시작 때 자동 생성)
      - ./plugins/pm_docs:/usr/src/redmine/plugins/pm_docs:z   # 산출물 관리 (산출물·변경요청·프로그램 목록·회의록·이슈·위험, DB 테이블은 시작 때 자동 생성)
      - ./setup:/usr/src/redmine/setup:z   # 기준 설정 스크립트 (apply_settings.rb)

volumes:
  db_data:
  files:
  keys:
